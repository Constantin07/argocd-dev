hello-kubernetes:
  replicaCount: 1

  deployment:
    enabled: false

  rollouts:
    enabled: true
    strategy:
      blueGreen:
        autoPromotionEnabled: true

  env:
    VAULT_SKIP: true

  hpa:
    enabled: true
    maxReplicas: 2

  connectivityTest:
    enabled: true

  httpRoute:
    enabled: true
    httpRoute:
    parentRefs:
      - name: kong
        namespace: kong
    hostnames:
      - hello-kubernetes.internal
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  ingress:
    enabled: false
    ingressClassName: kong
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: "http://hello-kubernetes.internal:30000"
    host: hello-kubernetes.internal
